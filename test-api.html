<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار API - رسائل التخرج</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        
        h2 {
            color: #764ba2;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .messages-list {
            margin-top: 20px;
        }
        
        .message-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .message-item strong {
            color: #764ba2;
        }
        
        .message-item small {
            color: #666;
        }
        
        .delete-btn {
            background: #dc3545;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 10px;
            width: auto;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bee5eb;
        }
        
        .logged-in-status {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎓 اختبار API - رسائل التخرج</h1>
            <div class="info">
                <strong>ℹ️ معلومات:</strong><br>
                • تأكد من تشغيل السيرفر: <code>cd backend && node server.js</code><br>
                • السيرفر يعمل على: <code>http://localhost:5000</code><br>
                • كلمة مرور الأدمن: <code>admin123</code>
            </div>
        </div>

        <!-- قسم المستخدم -->
        <div class="card">
            <h2>👤 قسم المستخدم (User)</h2>
            
            <div class="section">
                <label>الاسم (اختياري):</label>
                <input type="text" id="userName" placeholder="أدخل اسمك" maxlength="50">
                
                <label>الرسالة:</label>
                <textarea id="userMessage" placeholder="اكتب رسالتك هنا..." maxlength="500" required></textarea>
                
                <button onclick="sendMessage()">📤 إرسال رسالة</button>
                
                <div id="userStatus" class="status"></div>
            </div>
        </div>

        <!-- قسم الأدمن -->
        <div class="card">
            <h2>🔐 قسم الأدمن (Admin)</h2>
            
            <!-- تسجيل الدخول -->
            <div id="loginSection" class="section">
                <label>كلمة المرور:</label>
                <input type="password" id="adminPassword" placeholder="admin123">
                
                <button onclick="login()">🔑 تسجيل الدخول</button>
                
                <div id="loginStatus" class="status"></div>
            </div>

            <!-- قسم الرسائل (يظهر بعد تسجيل الدخول) -->
            <div id="messagesSection" style="display: none;">
                <div class="logged-in-status">
                    ✅ أنت مسجل دخول كأدمن
                </div>
                
                <button onclick="loadMessages()">🔄 تحميل الرسائل</button>
                <button onclick="logout()" style="background: #6c757d; margin-top: 10px;">🚪 تسجيل خروج</button>
                
                <div id="messagesStatus" class="status"></div>
                
                <div id="messagesList" class="messages-list"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // التحقق من تسجيل الدخول عند تحميل الصفحة
        window.addEventListener('load', () => {
            if (isAdminLoggedIn()) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('messagesSection').style.display = 'block';
            }
        });

        // إرسال رسالة (User)
        async function sendMessage() {
            const name = document.getElementById('userName').value.trim();
            const text = document.getElementById('userMessage').value.trim();
            const statusDiv = document.getElementById('userStatus');
            
            if (!text) {
                showStatus(statusDiv, 'الرجاء كتابة رسالة', 'error');
                return;
            }
            
            const result = await sendMessageToAPI(text, name);
            
            if (result) {
                showStatus(statusDiv, 'تم إرسال رسالتك بنجاح! 🎉', 'success');
                document.getElementById('userName').value = '';
                document.getElementById('userMessage').value = '';
            } else {
                showStatus(statusDiv, 'فشل إرسال الرسالة', 'error');
            }
        }

        // تسجيل دخول الأدمن
        async function login() {
            const password = document.getElementById('adminPassword').value;
            const statusDiv = document.getElementById('loginStatus');
            
            if (!password) {
                showStatus(statusDiv, 'الرجاء إدخال كلمة المرور', 'error');
                return;
            }
            
            const token = await adminLogin(password);
            
            if (token) {
                showStatus(statusDiv, 'تم تسجيل الدخول بنجاح! 🎉', 'success');
                setTimeout(() => {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('messagesSection').style.display = 'block';
                }, 1000);
            } else {
                showStatus(statusDiv, 'كلمة المرور غير صحيحة', 'error');
            }
        }

        // تحميل الرسائل
        async function loadMessages() {
            const statusDiv = document.getElementById('messagesStatus');
            const messagesDiv = document.getElementById('messagesList');
            
            showStatus(statusDiv, 'جاري تحميل الرسائل...', 'success');
            
            const messages = await getAllMessages();
            
            if (messages) {
                showStatus(statusDiv, `تم تحميل ${messages.length} رسالة`, 'success');
                displayMessages(messages);
            } else {
                showStatus(statusDiv, 'فشل تحميل الرسائل', 'error');
            }
        }

        // عرض الرسائل
        function displayMessages(messages) {
            const messagesDiv = document.getElementById('messagesList');
            messagesDiv.innerHTML = '';
            
            if (messages.length === 0) {
                messagesDiv.innerHTML = '<p style="text-align: center; color: #666;">لا توجد رسائل</p>';
                return;
            }
            
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-item';
                messageDiv.innerHTML = `
                    <p><strong>👤 ${message.name || 'مجهول'}</strong></p>
                    <p>💬 ${message.text}</p>
                    <p><small>🕒 ${new Date(message.timestamp).toLocaleString('ar-EG')}</small></p>
                    <button class="delete-btn" onclick="deleteMsg('${message._id}')">🗑️ حذف</button>
                `;
                messagesDiv.appendChild(messageDiv);
            });
        }

        // حذف رسالة
        async function deleteMsg(messageId) {
            if (!confirm('هل أنت متأكد من حذف هذه الرسالة؟')) {
                return;
            }
            
            const success = await deleteMessage(messageId);
            
            if (success) {
                loadMessages(); // إعادة تحميل الرسائل
            }
        }

        // تسجيل خروج
        function logout() {
            adminLogout();
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('messagesSection').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        // عرض رسالة الحالة
        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `status ${type}`;
            element.style.display = 'block';
            
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
